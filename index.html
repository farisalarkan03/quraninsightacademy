<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quran Insight Academy — Bimbingan Al-Quran Terpercaya</title>
  <meta name="description" content="Quran Insight Academy menyediakan program bimbingan Al-Quran berkualitas untuk anak dan dewasa, baik program bimbel kelompok maupun privat." />
  <meta name="robots" content="index, follow" />
  <meta property="og:title" content="Quran Insight Academy" />
  <meta property="og:description" content="Program bimbingan Al-Quran terpercaya — Bimbel & Privat" />
  <meta property="og:type" content="website" />
  <!-- Favicon -->
  <!-- Google Fonts: Plus Jakarta Sans & Amiri -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous" />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Amiri:wght@700&display=swap" rel="stylesheet" />
  <!-- Google Fonts: Material Symbols Rounded -->
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
  <!-- FontAwesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" crossorigin="anonymous" />
  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
</head>
<body>
  <!-- SPA Mount Point -->
  <div id="app">
    <!-- Loading skeleton saat pertama muat -->
    <div id="initial-loader" style="
      position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
      background:#1a0a02;flex-direction:column;gap:20px;z-index:9999;
    ">
      <div style="
        width:64px;height:64px;border-radius:18px;
        background:linear-gradient(135deg,#d97706,#F0AF43);
        display:flex;align-items:center;justify-content:center;
        box-shadow:0 8px 32px rgba(240,175,67,0.4);
      "><span class="ms" style="font-size:34px;color:#221104;">menu_book</span></div>
      <div style="width:44px;height:44px;border:4px solid rgba(240,175,67,0.2);
        border-top-color:#F0AF43;border-radius:50%;animation:s 0.8s linear infinite;">
      </div>
      <p style="color:#c9a87a;font-family:system-ui,sans-serif;font-size:14px;">
        Memuat Quran Insight Academy…
      </p>
    </div>
  </div>

  <!-- Toast Container (global) -->
  <div id="toast-container"></div>

  <style>
    @keyframes s { to { transform: rotate(360deg); } }
    body { margin: 0; overflow-x: hidden; }
  </style>

  <script>
    // Fail-safe: pastikan loader hilang maksimal dalam 2 detik
    setTimeout(function() {
      var l = document.getElementById('initial-loader');
      if (l) { l.style.opacity = '0'; setTimeout(function(){ if (l.parentNode) l.parentNode.removeChild(l); }, 300); }
    }, 2000);
  </script>

  <!-- Main App -->
  <script type="module" src="/src/main.js"></script>
</body>
</html>
